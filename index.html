<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kota Yatagai</title>
  <link rel="icon" href="assets/sql.webp" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP&display=swap" rel="stylesheet">
  <script defer src="i18n/en.js"></script>
  <script defer src="i18n/ja.js"></script>
  <script defer src="script.js"></script>
</head>
<body>

<div class="header">
  <select id="lang-select">
    <option value="en">English</option>
    <option value="ja">日本語</option>
  </select>
  <button class="print" onclick="openPrintDialog()">
    <img src="assets/print.svg" alt="Print" height="20px"/>
  </button>
</div>


<div>
  <img class="formal-pic" src="assets/me-forest.webp" alt="Kota Yatagai" height="200px" />
  <div>
    <h1 id="name"></h1>
    <p id="intro"></p>
  </div>
</div>

<p>
  Blog: <a id="blog-link" href="https://blog.kota-yata.com" target="_blank" rel="noopener noreferrer">blog.kota-yata.com</a><br>
  GitHub: <a href="https://github.com/kota-yata" target="_blank" rel="noopener noreferrer">kota-yata</a><br>
  LinkedIn: <a href="https://www.linkedin.com/in/kota-yata/" target="_blank" rel="noopener noreferrer">kota-yata</a>
</p>

<hr class="section-sep">

<section id="projects-section">
  <h2 id="projects-title"></h2>
  <div id="projects-entries"></div>
</section>

<hr class="section-sep">

<section id="oss-section">
  <h2 id="oss-title"></h2>
  <div id="oss-entries"></div>
</section>

<hr class="section-sep">

<section id="qualifications-section">
  <h2 id="qualifications-title"></h2>
  <div id="qualifications-entries"></div>
</section>

<hr class="section-sep">

<section id="work-section">
  <h2 id="work-title"></h2>
  <div id="work-entries"></div>
</section>

<hr class="section-sep">

<footer>
  2025 © Kota Yatagai
</footer>

<!-- Print Order Modal -->
<div id="print-modal" class="modal-overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="print-modal-title">
    <h3 id="print-modal-title">Arrange Sections to Print</h3>
    <ul id="order-list" class="order-list">
      <!-- populated by script.js -->
    </ul>
    <div class="modal-actions">
      <button type="button" id="print-cancel">Cancel</button>
      <button type="button" id="print-confirm" class="primary">Print</button>
    </div>
  </div>
  <button class="modal-close" aria-label="Close" id="print-modal-close">×</button>
  <div class="modal-backdrop" id="print-modal-backdrop"></div>
</div>

<!-- Staging container shown only for print -->
<div id="print-staging" aria-hidden="true"></div>

  <script defer src="print.js"></script>
</body>
</html>
