user kota staff;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;

    types {
        text/html                             html htm;
        text/css                              css;
        text/xml                              xml;
        image/gif                             gif;
        image/jpeg                            jpeg jpg;
        image/png                             png;
        image/svg+xml                         svg svgz;
        application/javascript                js;
        application/json                      json;
        font/woff                             woff;
        font/woff2                            woff2;
        font/ttf                              ttf;
        font/eot                              eot;
    }

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 7878;
        server_name localhost;

        root /Users/kota/dev/repos/portfolio/dist;
        index index.html;

        # index.html は毎回オリジンで更新を確認する
        location = /index.html {
            expires 1h;
            add_header Cache-Control "public";
        }

        # ハッシュ付きアセットを含む、index.html 以外のファイル
        location / {
            try_files $uri $uri/ =404;
            expires 360d;
            add_header Cache-Control "public, immutable";
        }
    }
}
